<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>AI Chatbot Dashboard</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#f4f7fb;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:30px;
    gap:30px;
}

/* CHAT */

.chat-container{
    width:900px;
    max-width:95%;
    height:85vh;
    background:white;
    border-radius:20px;
    box-shadow:0 10px 30px rgba(0,0,0,0.1);
    display:flex;
    flex-direction:column;
    overflow:hidden;
}

.header{
    background:#0f172a;
    color:white;
    padding:20px;
    text-align:center;
    font-size:22px;
    font-weight:bold;
}

.chatbox{
    flex:1;
    overflow-y:auto;
    padding:20px;
    background:#f8fafc;
}

.message{
    margin-bottom:15px;
    display:flex;
}

.user{
    justify-content:flex-end;
}

.bot{
    justify-content:flex-start;
}

.bubble{
    max-width:70%;
    padding:12px 16px;
    border-radius:15px;
    word-wrap:break-word;
}

.user .bubble{
    background:#2563eb;
    color:white;
}

.bot .bubble{
    background:white;
    border:1px solid #ddd;
}

.input-area{
    display:flex;
    padding:15px;
    border-top:1px solid #ddd;
    background:white;
}

#message{
    flex:1;
    padding:12px;
    border:1px solid #ccc;
    border-radius:10px;
    font-size:16px;
}

button{
    margin-left:10px;
    padding:12px 20px;
    border:none;
    border-radius:10px;
    background:#2563eb;
    color:white;
    cursor:pointer;
    font-size:16px;
}

button:hover{
    background:#1d4ed8;
}

.loading{
    color:gray;
    font-style:italic;
}

.popup{
    position:fixed;
    top:20px;
    right:20px;
    background:#ef4444;
    color:white;
    padding:15px 20px;
    border-radius:10px;
    display:none;
    font-weight:bold;
    box-shadow:0 5px 15px rgba(0,0,0,.2);
}

/* DASHBOARD */

.dashboard-container{
    width:900px;
    max-width:95%;
    background:white;
    border-radius:20px;
    padding:30px;
    box-shadow:0 10px 30px rgba(0,0,0,0.1);
}

.dashboard-header{
    font-size:28px;
    font-weight:bold;
    color:#0f172a;
    margin-bottom:25px;
}

.analytics-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:20px;
}

.analytics-card{
    background:#f8fafc;
    border:1px solid #e2e8f0;
    border-radius:15px;
    padding:25px;
    min-height:140px;
}

.analytics-title{
    color:#64748b;
    font-size:14px;
    margin-bottom:15px;
}

.analytics-value{
    font-size:34px;
    font-weight:bold;
    color:#0f172a;
}

</style>
</head>

<body>

<div id="popup" class="popup">
    <span id="popupText"></span>
</div>

<!-- CHAT -->

<div class="chat-container">

    <div class="header">
        AI Chatbot
    </div>

    <div class="chatbox" id="chatbox">

        <div class="message bot">
            <div class="bubble">
                Hello! How can I help you today?
            </div>
        </div>

    </div>

    <div class="input-area">

        <input
            type="text"
            id="message"
            placeholder="Type your message..."
        >

        <button onclick="sendMessage()">
            Send
        </button>

    </div>

</div>

<!-- ANALYTICS -->

<div class="dashboard-container">

    <div class="dashboard-header">
        Analytics Dashboard
    </div>

    <div class="analytics-grid">

        <div class="analytics-card">
            <div class="analytics-title">
                Total Messages
            </div>
            <div class="analytics-value" id="totalMessages">
                0
            </div>
        </div>

        <div class="analytics-card">
            <div class="analytics-title">
                Total Sessions
            </div>
            <div class="analytics-value" id="totalSessions">
                0
            </div>
        </div>

        <div class="analytics-card">
            <div class="analytics-title">
                Total Tokens
            </div>
            <div class="analytics-value" id="totalTokens">
                0
            </div>
        </div>

        <!-- future widgets -->

        <div class="analytics-card">
            <div class="analytics-title">
                Average Response Time
            </div>
            <div class="analytics-value" id="avgResponseTime">
                --
            </div>
        </div>

        <div class="analytics-card">
            <div class="analytics-title">
                Future Analytics Block
            </div>
            <div class="analytics-value">
                Empty
            </div>
        </div>

        <div class="analytics-card">
            <div class="analytics-title">
                Future Analytics Block
            </div>
            <div class="analytics-value">
                Empty
            </div>
        </div>

    </div>

</div>

<script>

const input = document.getElementById("message");

input.addEventListener("keypress", function(event){

    if(event.key === "Enter"){
        sendMessage();
    }

});

async function loadAnalytics(){

    try{

        const token = localStorage.getItem("token");

        const response = await fetch(
            "http://127.0.0.1:8000/app1/analytics/",
            {
                method:"GET",
                headers:{
                    "Authorization":`Token ${token}`
                }
            }
        );

        const data = await response.json();

        document.getElementById("totalMessages").innerText =
            data.total_messages ?? 0;

        document.getElementById("totalSessions").innerText =
            data.total_sessions ?? 0;

        document.getElementById("totalTokens").innerText =
            data.total_tokens ?? 0;

        if(data.avg_response_time !== undefined){
            document.getElementById("avgResponseTime").innerText =
                Number(data.avg_response_time).toFixed(2)+"s";
        }

    }
    catch(error){
        console.log("Analytics Error:",error);
    }

}

async function sendMessage(){

    const messageInput = document.getElementById("message");
    const message = messageInput.value.trim();

    if(!message){
        return;
    }

    const chatbox = document.getElementById("chatbox");

    chatbox.innerHTML += `
        <div class="message user">
            <div class="bubble">
                ${message}
            </div>
        </div>
    `;

    chatbox.innerHTML += `
        <div class="message bot" id="loading">
            <div class="bubble loading">
                Thinking...
            </div>
        </div>
    `;

    chatbox.scrollTop = chatbox.scrollHeight;

    messageInput.value = "";

    try{

        const token = localStorage.getItem("token");

        const response = await fetch(
            "http://127.0.0.1:8000/app1/query/",
            {
                method:"POST",
                headers:{
                    "Content-Type":"application/json",
                    "Authorization":`Token ${token}`
                },
                body:JSON.stringify({
                    message:message
                })
            }
        );

        const data = await response.json();

        if(document.getElementById("loading")){
            document.getElementById("loading").remove();
        }

        if(!response.ok){

            if(response.status === 429){
                showPopup(data.message);
            }
            else{
                showPopup("Something went wrong.");
            }

            return;
        }

        chatbox.innerHTML += `
            <div class="message bot">
                <div class="bubble">
                    ${data.response["bot message"]}
                </div>
            </div>
        `;

        chatbox.scrollTop = chatbox.scrollHeight;

        await loadAnalytics();

    }
    catch(error){

        if(document.getElementById("loading")){
            document.getElementById("loading").remove();
        }

        chatbox.innerHTML += `
            <div class="message bot">
                <div class="bubble">
                    Error connecting to server.
                </div>
            </div>
        `;

        chatbox.scrollTop = chatbox.scrollHeight;
    }
}

function showPopup(message){

    const popup = document.getElementById("popup");
    const popupText = document.getElementById("popupText");

    popupText.innerText = message;
    popup.style.display = "block";

    setTimeout(() => {
        popup.style.display = "none";
    }, 3000);
}

window.onload = () => {
    loadAnalytics();
};

</script>

</body>
</html>
