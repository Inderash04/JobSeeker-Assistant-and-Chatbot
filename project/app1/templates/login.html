<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AI Chatbot Login</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{

    height:100vh;

    display:flex;
    justify-content:center;
    align-items:center;

    background:linear-gradient(135deg,#0f172a,#1e293b,#312e81);

    overflow:hidden;

}

body::before{

    content:"";

    position:absolute;

    width:450px;
    height:450px;

    background:#6366f1;

    border-radius:50%;

    top:-120px;
    left:-100px;

    filter:blur(120px);

}

body::after{

    content:"";

    position:absolute;

    width:400px;
    height:400px;

    background:#06b6d4;

    border-radius:50%;

    bottom:-120px;
    right:-100px;

    filter:blur(120px);

}

.container{

    position:relative;

    width:380px;

    padding:40px;

    border-radius:22px;

    background:rgba(255,255,255,0.08);

    backdrop-filter:blur(18px);

    border:1px solid rgba(255,255,255,0.15);

    box-shadow:0 20px 50px rgba(0,0,0,.4);

    z-index:2;

}

.logo{

    width:80px;
    height:80px;

    margin:auto;

    border-radius:50%;

    background:linear-gradient(135deg,#6366f1,#06b6d4);

    display:flex;
    align-items:center;
    justify-content:center;

    color:white;

    font-size:35px;

    margin-bottom:18px;

}

h2{

    color:white;

    text-align:center;

    margin-bottom:6px;

}

.subtitle{

    text-align:center;

    color:#cbd5e1;

    margin-bottom:28px;

    font-size:14px;

}

.input-box{

    position:relative;

    margin-bottom:18px;

}

.input-box input{

    width:100%;

    padding:15px 45px;

    border:none;

    border-radius:12px;

    outline:none;

    font-size:15px;

    color:white;

    background:rgba(255,255,255,.08);

}

.input-box input::placeholder{

    color:#cbd5e1;

}

.input-box i{

    position:absolute;

    top:50%;
    transform:translateY(-50%);

    color:#d1d5db;

}

.input-box .left{

    left:16px;

}

.input-box .right{

    right:16px;

    cursor:pointer;

}

button{

    width:100%;

    padding:15px;

    border:none;

    border-radius:12px;

    background:linear-gradient(135deg,#6366f1,#06b6d4);

    color:white;

    font-size:16px;

    font-weight:600;

    cursor:pointer;

    transition:.3s;

}

button:hover{

    transform:translateY(-2px);

    box-shadow:0 12px 30px rgba(99,102,241,.45);

}

button:disabled{

    opacity:.7;

    cursor:not-allowed;

}

#error{

    margin-top:18px;

    text-align:center;

    color:#ffb4b4;

    font-size:14px;

}

.footer{

    text-align:center;

    margin-top:25px;

    color:#94a3b8;

    font-size:13px;

}

</style>

</head>

<body>

<div class="container">

    <div class="logo">
        <i class="fa-solid fa-robot"></i>
    </div>

    <h2>Welcome Back</h2>

    <div class="subtitle">
        Login to continue chatting with your AI Assistant
    </div>

    <div class="input-box">

        <i class="fa-solid fa-user left"></i>

        <input
        type="text"
        id="username"
        placeholder="Username">

    </div>

    <div class="input-box">

        <i class="fa-solid fa-lock left"></i>

        <input
        type="password"
        id="password"
        placeholder="Password">

        <i
        class="fa-solid fa-eye right"
        id="togglePassword">
        </i>

    </div>

    <button id="loginBtn" onclick="login()">
        Login
    </button>

    <div id="error"></div>

    <div class="footer">
        Powered by AI
    </div>

</div>

<script>

const password=document.getElementById("password");

const eye=document.getElementById("togglePassword");

eye.onclick=()=>{

    if(password.type==="password"){

        password.type="text";

        eye.classList.replace("fa-eye","fa-eye-slash");

    }

    else{

        password.type="password";

        eye.classList.replace("fa-eye-slash","fa-eye");

    }

};

document.addEventListener("keypress",(e)=>{

    if(e.key==="Enter"){

        login();

    }

});

async function login(){

    const username=document.getElementById("username").value.trim();

    const password=document.getElementById("password").value;

    const btn=document.getElementById("loginBtn");

    const error=document.getElementById("error");

    error.innerHTML="";

    if(!username || !password){

        error.innerHTML="Please enter username and password.";

        return;

    }

    btn.disabled=true;
    btn.innerHTML='<i class="fa-solid fa-spinner fa-spin"></i> Logging in...';

    try{

        const response=await fetch("http://127.0.0.1:8000/app1/login/",{

            method:"POST",

            headers:{
                "Content-Type":"application/json"
            },

            body:JSON.stringify({

                name:username,
                phone:password

            })

        });

        const data=await response.json();

        if(response.ok && data.token){

            localStorage.setItem("token",data.token);

            window.location.href="/app1/botselection/";

        }

        else{

            localStorage.removeItem("token");

            error.innerHTML="Invalid username or password.";

        }

    }

    catch(err){

        error.innerHTML="Unable to connect to server.";

    }

    btn.disabled=false;
    btn.innerHTML="Login";

}

</script>

</body>
</html>
